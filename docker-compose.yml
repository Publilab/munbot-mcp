services:
  evolution-api:
    build: ./gateways/evolution-api
    container_name: evolution-api
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - munbot-net
    environment:
      - REDIS_HOST=redis
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      complaints-mcp:
        condition: service_started
      scheduler-mcp:
        condition: service_started

  evolution-manager:
    build: ./gateways/evolution-manager
    container_name: evolution-manager
    env_file:
      - ./.env
    ports:
      - "9615:9615"
    restart: unless-stopped
    networks:
      - munbot-net
    depends_on:
      - evolution-api

  web-interface:
    build: 
      context: ./gateways/web-interface
      dockerfile: Dockerfile
    container_name: web-interface
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    environment:
      - MCP_URL=http://mcp-core:5000/orchestrate
    restart: unless-stopped
    networks:
      - munbot-net
    depends_on:
      evolution-api:
        condition: service_started
      mcp-core:
        condition: service_healthy

  postgres:
    image: postgres:14
    container_name: postgres
    env_file:
      - ./.env
    environment:
      # Ensure database initializes with a superuser and password
      POSTGRES_DB: munbot
      POSTGRES_USER: munbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases:/docker-entrypoint-initdb.d
    networks:
      - munbot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - munbot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  
      
  mcp-core:
    build:
      context: .
      dockerfile: mcp-core/Dockerfile
    container_name: mcp-core
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - DOCS_DIR=/app/documents
      - HUMAN_ESCALATION_LOG=/app/human_escalations.log
      - PROMPTS_PATH=/app/mcp-core/prompts
      - TOOL_SCHEMAS_PATH=/app/mcp-core/tool_schemas
      - SCHEDULER_MCP_URL=${SCHEDULER_MCP_URL:-http://scheduler-mcp:6001/tools/call}
      - COMPLAINTS_MCP_URL=${COMPLAINTS_MCP_URL:-http://complaints-mcp:7000/tools/call}
      - INTENT_SIMILARITY_PATH=${INTENT_SIMILARITY_PATH:-mcp-core/config/intent_similarities.json}
      - INTENT_SIMILARITY_THRESHOLD=${INTENT_SIMILARITY_THRESHOLD:-0.55}
    ports:
      - "5000:5000"
    networks:
      - munbot-net
    volumes:
      - ./mcp-core/models:/mcp-core/models
      - ./services:/app/services:ro
      - ./logs/human_escalations.log:/app/human_escalations.log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Use OpenAPI as a robust readiness signal (FastAPI exposes it by default)
      test: ["CMD-SHELL", "curl -f http://localhost:5000/openapi.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Período de gracia para que el contenedor complete su arranque (carga de modelo LLM)
      start_period: 300s

  complaints-mcp:
    build: 
      context: ./services/complaints-mcp
      dockerfile: Dockerfile
    container_name: complaints-mcp
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://munbot:${POSTGRES_PASSWORD:-1234}@postgres:5432/munbot
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      # Variable para el remitente del correo
      - GMAIL_FROM=tu-correo-verificado@gmail.com
    ports:
      - "7000:7000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - munbot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 5


  scheduler-mcp:
    build: 
      context: ./services/scheduler-mcp
      dockerfile: Dockerfile
    container_name: scheduler-mcp
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://munbot:${POSTGRES_PASSWORD:-1234}@postgres:5432/munbot
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      # Variable para el remitente del correo
      - GMAIL_FROM=tu-correo-verificado@gmail.com

    ports:
      - "6001:6001"
    restart: unless-stopped
    networks:
      - munbot-net
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - munbot-net

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_HTTP_PORT=3030
    ports:
      - "3030:3030"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    networks:
      - munbot-net

networks:
  munbot-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
