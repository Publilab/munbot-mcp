services:
  evolution-api:
    build: ./gateways/evolution-api
    container_name: evolution-api
    env_file:
      - ./gateways/evolution-api/.env
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - munbot-net
    environment:
      - REDIS_HOST=redis
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      complaints-mcp:
        condition: service_started
      llm_docs-mcp:
        condition: service_started
      scheduler-mcp:
        condition: service_started

  evolution-manager:
    build: ./gateways/evolution-manager
    container_name: evolution-manager
    env_file:
      - ./gateways/evolution-manager/.env
    ports:
      - "9615:9615"
    restart: unless-stopped
    networks:
      - munbot-net
    depends_on:
      - evolution-api

  web-interface:
    build: 
      context: ./gateways/web-interface
      dockerfile: Dockerfile
    container_name: web-interface
    env_file:
      - ./gateways/web-interface/.env
    ports:
      - "3000:3000"
    environment:
      - MCP_URL=http://mcp-core:5000/orchestrate
    restart: unless-stopped
    networks:
      - munbot-net
    depends_on:
      evolution-api:
        condition: service_started
      mcp-core:
        condition: service_healthy

  postgres:
    image: postgres:14
    container_name: postgres
    env_file:
      - ./databases/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases:/docker-entrypoint-initdb.d
    networks:
      - munbot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - munbot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: qdrant
    ports:
      - "6333:6333"
    networks:
      - munbot-net
    volumes:
      - qdrant_data:/qdrant/storage
      
  mcp-core:
    build:
      context: .
      dockerfile: mcp-core/Dockerfile
    container_name: mcp-core
    env_file:
      - ./mcp-core/.env
    environment:
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - DOCS_DIR=/app/documents
      - HUMAN_ESCALATION_LOG=/app/human_escalations.log
      - LLM_DOCS_MCP_URL=http://llm_docs-mcp:8000/tools/call
      - LLM_DOCS_API_KEY=${LLM_DOCS_API_KEY:-}
      - LLM_DOCS_MCP_USER=${LLM_DOCS_MCP_USER:-}
      - LLM_DOCS_MCP_PASSWORD=${LLM_DOCS_MCP_PASSWORD:-}
    ports:
      - "5000:5000"
    networks:
      - munbot-net
    volumes:
      - ./mcp-core/models:/mcp-core/models
      - ./services:/app/services:ro
      - ./services/llm_docs-mcp/documents:/app/documents:ro
      - ./logs/human_escalations.log:/app/human_escalations.log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      llm_docs-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Período de gracia para que el contenedor complete su arranque (carga de modelo LLM)
      start_period: 300s

  complaints-mcp:
    build: 
      context: ./services/complaints-mcp
      dockerfile: Dockerfile
    container_name: complaints-mcp
    env_file:
      - ./services/complaints-mcp/.env
    environment:
      - REDIS_HOST=redis
      # Variable para el remitente del correo
      - GMAIL_FROM=tu-correo-verificado@gmail.com
    ports:
      - "7000:7000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - munbot-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  llm_docs-mcp:
    build:
      context: .
      dockerfile: services/llm_docs-mcp/Dockerfile
    container_name: llm_docs-mcp
    env_file:
      - ./services/llm_docs-mcp/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=munbot_docs
      - EMBEDDINGS_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - EMBEDDINGS_DIM=384
      - DOCS_DIR=/app/documents
      - REDIS_HOST=redis
      - QDRANT_SIMILARITY_THRESHOLD=0.5
      - LLM_MAX_NEW_TOKENS=150
      - MODEL_PATH=/app/models/phi-2.Q4_K_M.gguf # o nombre HF para transformers
      - N_THREADS=4
      - N_CTX=2048
      - ALLOWED_IPS=127.0.0.1,172.18.0.0/16
      - LLM_DOCS_API_KEY=${LLM_DOCS_API_KEY:-}
      - LLM_DOCS_MCP_USER=${LLM_DOCS_MCP_USER:-}
      - LLM_DOCS_MCP_PASSWORD=${LLM_DOCS_MCP_PASSWORD:-}
      - LOG_DIR=/app/logs
      - LOG_PATH=/app/logs/llm_docs_gateway.log
    depends_on:
      - qdrant
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - munbot-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; 
            sys.exit(urllib.request.urlopen('http://localhost:8000/health').getcode()!=200)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Período de gracia para que el contenedor complete su arranque (indexación, carga de modelos)
      start_period: 300s
    volumes:
      
      - ./services/llm_docs-mcp/documents:/app/documents:ro
      - ./logs:/app/logs

  scheduler-mcp:
    build: 
      context: ./services/scheduler-mcp
      dockerfile: Dockerfile
    container_name: scheduler-mcp
    env_file:
      - ./services/scheduler-mcp/.env
    environment:
      - REDIS_HOST=redis
      # Variable para el remitente del correo
      - GMAIL_FROM=tu-correo-verificado@gmail.com

    ports:
      - "6001:6001"
    restart: unless-stopped
    networks:
      - munbot-net
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  munbot-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data: